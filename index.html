<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bursa Nilüfer Rotary Kulübü | Üniversite Öğrenci Bursları</title>
  <meta name="description" content="Bursa Nilüfer Rotary Kulübü Üniversite Öğrenci Bursları: 25+ sene, 450+ öğrenci desteği.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bursa Nilüfer Rotary Kulübü">
  <meta property="og:description" content="Üniversite Öğrenci Bursları: 25+ sene, 450+ öğrenci desteği.">
  <meta name="theme-color" content="#17458f">
  <style>
    :root {
      --blue: #17458f;   /* Rotary royal blue */
      --azure: #0067c8;  /* Rotary azure */
      --gold: #f7a81b;   /* Rotary gold */
      --ink: #0f1f3d;
      --muted: #56627a;
      --bg: #f6f8fc;
      --page: min(72rem, 100% - 3rem);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg) radial-gradient(rgba(23, 69, 143, 0.07) 1px, transparent 1px) 0 0 / 22px 22px;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
    }

    /* Soft blue and gold glows behind the content */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      top: -30vmax;
      right: -25vmax;
      width: 75vmax;
      height: 75vmax;
      background: radial-gradient(closest-side, rgba(0, 103, 200, 0.22), transparent);
    }
    body::after {
      bottom: -30vmax;
      left: -25vmax;
      width: 65vmax;
      height: 65vmax;
      background: radial-gradient(closest-side, rgba(247, 168, 27, 0.26), transparent);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: var(--page);
      margin-inline: auto;
      padding-block: 3rem 2rem;
    }

    .accent {
      width: 4.5rem;
      height: 0.375rem;
      margin-bottom: 1.5rem;
      border-radius: 999px;
      background: var(--gold);
    }

    h1 {
      max-width: 15ch;
      margin: 0;
      font-size: clamp(2.75rem, 1.6rem + 5vw, 6rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      color: var(--blue);
      text-wrap: balance;
    }

    .subtitle {
      margin: 1.25rem 0 0;
      font-size: clamp(1.25rem, 0.95rem + 1.2vw, 2rem);
      font-weight: 500;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 18rem));
      gap: 1rem;
      margin-top: clamp(2rem, 5vh, 3.5rem);
    }

    .stat {
      padding: 1.5rem 1.5rem 1.375rem;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(23, 69, 143, 0.1);
      border-radius: 1.25rem;
      box-shadow: 0 1px 2px rgba(15, 31, 61, 0.04), 0 16px 36px -16px rgba(15, 31, 61, 0.2);
      backdrop-filter: blur(8px);
    }
    .stat::before {
      content: "";
      display: block;
      width: 2.5rem;
      height: 0.25rem;
      margin-bottom: 1.25rem;
      border-radius: 999px;
      background: var(--gold);
    }

    .stat-value {
      margin: 0;
      font-size: clamp(2.5rem, 1.75rem + 3.5vw, 4.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      background: linear-gradient(135deg, var(--blue), var(--azure));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .count { display: inline-block; text-align: right; }

    .stat-label {
      margin: 0.75rem 0 0;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 0.625rem;
      margin-top: 1.75rem;
      padding: 0.95rem 1.6rem;
      font-size: 1.0625rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      background: var(--blue);
      border-radius: 999px;
      box-shadow: 0 10px 24px -10px rgba(23, 69, 143, 0.6);
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    .cta span { transition: transform 0.2s; }
    .cta:hover { background: var(--azure); box-shadow: 0 14px 28px -12px rgba(0, 103, 200, 0.6); }
    .cta:hover span { transform: translateX(3px); }
    .cta:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
      width: var(--page);
      margin-inline: auto;
      padding-bottom: 2rem;
    }
    .brand img { display: block; width: auto; height: 3.5rem; }

    /* Contact stays at the bottom right, even when it wraps below the logo */
    .contact { margin: 0 0 0 auto; font-size: 0.9375rem; color: var(--muted); text-align: right; }
    .contact a { font-weight: 600; color: var(--blue); text-decoration: none; overflow-wrap: anywhere; }
    .contact a:hover { text-decoration: underline; }
    .contact a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (max-width: 40rem) {
      .hero { padding-top: 3rem; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
      .stat { padding: 1.25rem 1rem 1.125rem; }
      .stat-label { font-size: 0.75rem; }
      .brand img { height: 3rem; }
      .contact { font-size: 0.8125rem; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero > *, .brand { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .hero > :nth-child(2) { animation-delay: 0.08s; }
      .hero > :nth-child(3) { animation-delay: 0.16s; }
      .hero > :nth-child(4) { animation-delay: 0.26s; }
      .hero > :nth-child(5) { animation-delay: 0.34s; }
      .brand { animation-delay: 0.45s; }
      body::before { animation: drift 22s ease-in-out infinite alternate; }
      body::after { animation: drift 26s ease-in-out infinite alternate-reverse; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(1rem); } }
    @keyframes drift { to { transform: translate(-3vmax, 4vmax) scale(1.08); } }
  </style>
</head>
<body>
  <main class="hero">
    <div class="accent" aria-hidden="true"></div>
    <h1>Bursa Nilüfer Rotary Kulübü</h1>
    <p class="subtitle">Üniversite Öğrenci Bursları</p>

    <section class="stats" aria-label="Rakamlarla burs desteği">
      <div class="stat">
        <p class="stat-value" aria-hidden="true"><span class="count" data-target="25">25</span>+</p>
        <p class="stat-label"><span class="sr-only">25+ </span>sene</p>
      </div>
      <div class="stat">
        <p class="stat-value" aria-hidden="true"><span class="count" data-target="450">450</span>+</p>
        <p class="stat-label"><span class="sr-only">450+ </span>öğrenci desteği</p>
      </div>
    </section>

    <a class="cta" href="basvuru.html">Öğrenci Bilgi Formu <span aria-hidden="true">→</span></a>
  </main>

  <footer class="brand">
    <img src="RotaryMBS-Simple_CMYK-C.png" alt="Rotary" width="1774" height="667">
    <p class="contact">İletişim: <a href="mailto:komite@niluferrotaryburs.com">komite@niluferrotaryburs.com</a></p>
  </footer>

  <script>
    // Count up to each number once it is on screen (skipped when reduced motion is preferred)
    (() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;

      const duration = 1800;
      const easeOut = t => 1 - Math.pow(1 - t, 3);
      const run = el => {
        const target = Number(el.dataset.target);
        let start;
        const step = now => {
          start ??= now; // first painted frame, so a background tab still animates once shown
          const t = Math.min((now - start) / duration, 1);
          el.textContent = Math.round(easeOut(t) * target);
          if (t < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      };

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          observer.unobserve(entry.target);
          setTimeout(() => run(entry.target), 300);
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.count').forEach(el => {
        el.style.minWidth = `${el.dataset.target.length}ch`; // reserve the final width so nothing shifts
        el.textContent = '0';
        observer.observe(el);
      });
    })();
  </script>
</body>
</html>
